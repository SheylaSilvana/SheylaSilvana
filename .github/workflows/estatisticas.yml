name: Atualizar estatísticas do perfil

on:
  schedule:
    - cron: "0 6 * * *"   # todo dia às 3h de Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar cards e gráfico de atividade
        run: python scripts/gerar_estatisticas.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Salvar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/langs.svg assets/atividade.svg
          git diff --cached --quiet || git commit -m "Atualiza estatísticas do perfil"
          git push
