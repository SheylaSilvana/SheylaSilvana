        <path d="M48 14 Q 26 28 48 46 Z" fill="#e4dfd2"/>
        <path class="bandeira" d="M51 -4 L70 1 L51 6 Z" fill="#e0475b"/>
      </g>
    </g>
  </g>

  <g class="onda-frente">
