<svg xmlns="http://www.w3.org/2000/svg" width="854" height="120" viewBox="0 0 854 120">
  <defs>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d5bb8"/><stop offset="1" stop-color="#1a2a5e"/>
    </linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5677d6"/><stop offset="1" stop-color="#22336e"/>
    </linearGradient>
    <style>
      .onda-fundo { animation: corre 14s linear infinite; }
      .onda-frente { animation: corre 9s linear infinite; }
      @keyframes corre { from { transform: translateX(0); } to { transform: translateX(-854px); } }

      .viagem { animation: navega 22s linear infinite; }
      @keyframes navega { from { transform: translateX(-140px); } to { transform: translateX(900px); } }
      .barco { animation: balanca 3.5s ease-in-out infinite; transform-origin: 50px 62px; }
      @keyframes balanca {
        0%, 100% { transform: translateY(0) rotate(-3deg); }
        50% { transform: translateY(4px) rotate(3deg); }
      }
      .bandeira { animation: tremula 1.2s ease-in-out infinite; transform-origin: 52px 0px; }
      @keyframes tremula { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(0.8); } }
      .txt { font: 400 13px 'Segoe UI', Ubuntu, sans-serif; fill: #8b95b8; }
    </style>
  </defs>

  <text x="427" y="22" text-anchor="middle" class="txt">obrigada pela visita · até a próxima ilha</text>

  <g class="onda-fundo">
